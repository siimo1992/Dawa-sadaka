<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Outer Royal Blue Background -->
    <linearGradient id="outerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042472" />
      <stop offset="50%" stop-color="#031752" />
      <stop offset="100%" stop-color="#020c30" />
    </linearGradient>

    <!-- Inner Night Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040d38" />
      <stop offset="45%" stop-color="#0b1d6e" />
      <stop offset="70%" stop-color="#07124c" />
      <stop offset="100%" stop-color="#03092b" />
    </linearGradient>

    <!-- Neon Cyan Border Gradient -->
    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Golden Monument Main Gradient -->
    <linearGradient id="goldGate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Golden Monument Highlight Bevel -->
    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>

    <!-- Arch Inner Depth -->
    <linearGradient id="archDepth" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>

    <!-- AI Cyan Text & Chip Gradient -->
    <linearGradient id="aiCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000824" flood-opacity="0.7" />
    </filter>

    <clipPath id="squircleClip">
      <rect x="28" y="28" width="456" height="456" rx="102" />
    </clipPath>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="512" height="512" rx="116" fill="url(#outerBg)" />

  <!-- Main Clipped Squircle Content -->
  <g clip-path="url(#squircleClip)">
    <!-- Sky & Lower Base Background -->
    <rect x="28" y="28" width="456" height="456" fill="url(#skyGrad)" />

    <!-- Stars & Sparkles in Night Sky -->
    <g fill="#bae6fd" opacity="0.85">
      <circle cx="92" cy="86" r="1.8" />
      <circle cx="145" cy="68" r="1.4" />
      <circle cx="215" cy="64" r="1.6" />
      <circle cx="305" cy="66" r="1.5" />
      <circle cx="362" cy="82" r="2" />
      <circle cx="428" cy="112" r="1.6" />
      <circle cx="72" cy="138" r="1.5" />
      <circle cx="445" cy="168" r="1.4" />
      <!-- 4-Point Star Sparkles -->
      <path d="M166 78 L169 86 L177 89 L169 92 L166 100 L163 92 L155 89 L163 86 Z" fill="#7dd3fc" />
      <path d="M402 76 L405 83 L412 86 L405 89 L402 96 L399 89 L392 86 L399 83 Z" fill="#7dd3fc" />
      <path d="M84 182 L86 187 L91 189 L86 191 L84 196 L82 191 L77 189 L82 187 Z" fill="#38bdf8" />
    </g>

    <!-- Distant Night Desert Hills & Palm Silhouette -->
    <path d="M28 282 Q95 245 175 272 T345 268 Q420 250 484 275 L484 335 L28 335 Z" fill="#071042" />
    <!-- Desert Palm Silhouette on Right -->
    <g fill="#040a2e" transform="translate(432, 224) scale(0.85)">
      <path d="M0 60 Q2 32 0 8" stroke="#040a2e" stroke-width="5" stroke-linecap="round" fill="none" />
      <path d="M0 10 Q-18 -2 -32 10 Q-16 6 0 14 Z" />
      <path d="M0 10 Q18 -2 32 10 Q16 6 0 14 Z" />
      <path d="M0 8 Q-22 -14 -36 -2 Q-18 -2 0 10 Z" />
      <path d="M0 8 Q22 -14 36 -2 Q18 -2 0 10 Z" />
      <path d="M0 12 Q-14 14 -26 26 Q-12 20 0 16 Z" />
      <path d="M0 12 Q14 14 26 26 Q12 20 0 16 Z" />
    </g>

    <!-- Background Horizon Cyan Circuit Lines -->
    <g stroke="#00d4ff" stroke-width="2" fill="none" opacity="0.65">
      <path d="M28 288 H88 M28 304 H76 M28 320 H92" />
      <path d="M424 288 H484 M436 304 H484 M420 320 H484" />
    </g>

    <!-- Deep Navy Arch Interior Backdrop -->
    <rect x="110" y="175" width="292" height="158" fill="#05114a" />

    <!-- Glowing Cyan AI Circuit Board Network Inside the Arches -->
    <g stroke="#00e5ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#neonGlow)">
      <!-- Central Arch Radiating Traces -->
      <path d="M256 224 V192 M244 224 V198 L232 186 M268 224 V198 L280 186" />
      <path d="M256 280 V316 M244 280 V306 L230 320 M268 280 V306 L282 320" />
      <path d="M228 240 H202 L190 228 M228 252 H194 M228 264 H202 L188 278" />
      <path d="M284 240 H310 L322 228 M284 252 H318 M284 264 H310 L324 278" />
      <!-- Side Arches Circuit Traces -->
      <path d="M126 260 H154 L164 272 M132 280 H162 M128 298 H158" />
      <path d="M386 260 H358 L348 272 M380 280 H350 M384 298 H354" />
    </g>
    <!-- Circuit Nodes -->
    <g fill="#67e8f9">
      <circle cx="256" cy="192" r="3.5" />
      <circle cx="232" cy="186" r="3.5" />
      <circle cx="280" cy="186" r="3.5" />
      <circle cx="256" cy="316" r="3.5" />
      <circle cx="230" cy="320" r="3.5" />
      <circle cx="282" cy="320" r="3.5" />
      <circle cx="190" cy="228" r="3.5" />
      <circle cx="194" cy="252" r="3.5" />
      <circle cx="188" cy="278" r="3.5" />
      <circle cx="322" cy="228" r="3.5" />
      <circle cx="318" cy="252" r="3.5" />
      <circle cx="324" cy="278" r="3.5" />
      <circle cx="126" cy="260" r="3" />
      <circle cx="132" cy="280" r="3" />
      <circle cx="386" cy="260" r="3" />
      <circle cx="380" cy="280" r="3" />
    </g>

    <!-- Central AI Processor Core Chip (Vector Paths for Font-Free Precision) -->
    <g filter="url(#neonGlow)">
      <rect x="227" y="223" width="58" height="58" rx="13" fill="#061a5e" stroke="#00e5ff" stroke-width="3.2" />
      <rect x="233" y="229" width="46" height="46" rx="9" fill="#041040" stroke="#38bdf8" stroke-width="1.5" />
      <!-- Vector "AI" inside Core Chip -->
      <path d="M242.5 262 L249 242 H254 L260.5 262 H256.2 L254.9 257.5 H248.1 L246.8 262 Z M249.1 254.2 H253.9 L251.5 246.2 Z" fill="#ffffff" />
      <path d="M263.5 242 H268 V262 H263.5 Z" fill="#67e8f9" />
    </g>

    <!-- 3D Arch Inner Recess Walls (Warm Terracotta Depth) -->
    <path d="M74 332 L116 146 L142 172 L166 172 L182 108 L204 136 L232 136 L256 96 L280 136 L308 136 L330 108 L346 172 L370 172 L396 146 L438 332 H392 V252 A27 27 0 0 0 338 252 V332 H316 V246 A60 60 0 0 0 196 246 V332 H174 V252 A27 27 0 0 0 120 252 V332 Z" fill="url(#archDepth)" />

    <!-- Iconic Golden-Amber Tidikelt Monument Gate (Main Facade) -->
    <path d="M68 332
             L114 142
             L140 168
             L164 168
             L180 104
             L204 134
             L234 134
             L256 92
             L278 134
             L308 134
             L332 104
             L348 168
             L372 168
             L398 142
             L444 332
             H400
             V248
             A33 33 0 0 0 334 248
             V332
             H322
             V242
             A66 66 0 0 0 190 242
             V332
             H178
             V248
             A33 33 0 0 0 112 248
             V332
             Z"
          fill="url(#goldGate)"
          stroke="url(#goldBevel)"
          stroke-width="3"
          filter="url(#softShadow)" />

    <!-- Golden Arch Rim Trim Rings -->
    <path d="M184 332 V242 A72 72 0 0 1 328 242 V332" fill="none" stroke="#fde68a" stroke-width="3" opacity="0.85" />
    <path d="M108 332 V248 A37 37 0 0 1 182 248 V332" fill="none" stroke="#fde68a" stroke-width="2.2" opacity="0.8" />
    <path d="M330 332 V248 A37 37 0 0 1 404 248 V332" fill="none" stroke="#fde68a" stroke-width="2.2" opacity="0.8" />

    <!-- Pillar Base Blocks -->
    <g fill="#f59e0b" stroke="#fde68a" stroke-width="1.5">
      <rect x="70" y="268" width="38" height="64" rx="2" />
      <rect x="172" y="258" width="20" height="74" rx="2" />
      <rect x="320" y="258" width="20" height="74" rx="2" />
      <rect x="404" y="268" width="38" height="64" rx="2" />
    </g>

    <!-- Traditional Square Windows on the Monument (with Cyan AI Core Dots) -->
    <g fill="#1e1b4b" stroke="#fde047" stroke-width="1.5">
      <!-- 5 Upper Central Frieze Windows -->
      <rect x="190" y="148" width="14" height="14" rx="2" />
      <rect x="219" y="148" width="14" height="14" rx="2" />
      <rect x="249" y="148" width="14" height="14" rx="2" />
      <rect x="279" y="148" width="14" height="14" rx="2" />
      <rect x="308" y="148" width="14" height="14" rx="2" />
      <!-- 2 Left Wing Windows -->
      <rect x="130" y="188" width="13" height="13" rx="2" />
      <rect x="154" y="188" width="13" height="13" rx="2" />
      <!-- 2 Right Wing Windows -->
      <rect x="345" y="188" width="13" height="13" rx="2" />
      <rect x="369" y="188" width="13" height="13" rx="2" />
    </g>
    <!-- Glowing Cyan Dots Inside Monument Windows -->
    <g fill="#00e5ff">
      <circle cx="197" cy="155" r="2.3" />
      <circle cx="226" cy="155" r="2.3" />
      <circle cx="256" cy="155" r="2.3" />
      <circle cx="286" cy="155" r="2.3" />
      <circle cx="315" cy="155" r="2.3" />
      <circle cx="136.5" cy="194.5" r="2" />
      <circle cx="160.5" cy="194.5" r="2" />
      <circle cx="351.5" cy="194.5" r="2" />
      <circle cx="375.5" cy="194.5" r="2" />
    </g>

    <!-- Subtle Cyan Circuit Etchings on Golden Monument Facade -->
    <g stroke="#22d3ee" stroke-width="1.8" fill="none" opacity="0.75">
      <path d="M180 124 V166 H148" />
      <path d="M256 112 V142" />
      <path d="M332 124 V166 H364" />
      <path d="M116 220 H142 L152 210" />
      <path d="M396 220 H370 L360 210" />
    </g>

    <!-- Lower Dark Navy Stage for Official Brand Typography -->
    <rect x="28" y="332" width="456" height="152" fill="#030b33" />
    <line x1="54" y1="332" x2="458" y2="332" stroke="#f59e0b" stroke-width="2.5" opacity="0.8" />

    <!-- Official Brand Title: "تيدكلت AI" Crafted as Pure Vector Outlines -->
    <g filter="url(#softShadow)">
      <!-- Arabic "تيدكلت" in crisp bold geometric white vector paths -->
      <g fill="#ffffff">
        <!-- Word Segment 1 (Right: تـيـد) -->
        <path d="M240 408 H310 V382 H323 V421 H240 Z" />
        <rect x="281" y="386" width="13" height="35" rx="2" />
        <path d="M240 378 H266 V421 H253 V390 H240 Z" />
        <!-- Dots for تـ (top right) -->
        <circle cx="309" cy="369" r="5.2" />
        <circle cx="322" cy="369" r="5.2" />
        <!-- Dots for ـيـ (bottom middle) -->
        <circle cx="281" cy="432" r="5" />
        <circle cx="294" cy="432" r="5" />

        <!-- Word Segment 2 (Left: كـلـت) -->
        <path d="M92 408 H224 V421 H92 Z" />
        <!-- Stem & top bar of كـ -->
        <path d="M192 374 L224 364 V376 L205 382 V421 H192 Z" />
        <!-- Tall stem of ـلـ -->
        <rect x="160" y="362" width="13" height="59" rx="2" />
        <!-- Left boat end of ـت -->
        <rect x="92" y="382" width="13" height="39" rx="2" />
        <!-- Dots for ـت (top left) -->
        <circle cx="121" cy="373" r="5.2" />
        <circle cx="135" cy="373" r="5.2" />
      </g>

      <!-- "AI" in glowing cyan vector paths -->
      <g fill="url(#aiCyan)" filter="url(#neonGlow)">
        <path d="M348 421 L367 363 H382 L401 421 H387.5 L383.5 408 H365.5 L361.5 421 Z M368.5 397 H380.5 L374.5 376.5 Z" />
        <rect x="408" y="363" width="13.5" height="58" rx="2" />
      </g>
    </g>

    <!-- Bottom Symmetrical Cyan Circuit Underline -->
    <g stroke="#00e5ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#neonGlow)">
      <path d="M98 456 H220 L228 448 H242" />
      <path d="M270 448 H284 L292 456 H414" />
      <circle cx="256" cy="452" r="7.5" fill="#030b33" stroke="#00e5ff" stroke-width="3.5" />
    </g>
  </g>

  <!-- Outer Glowing Neon Cyan Squircle Frame -->
  <rect x="28" y="28" width="456" height="456" rx="102" fill="none" stroke="url(#cyanBorder)" stroke-width="6.5" filter="url(#neonGlow)" />
  <rect x="28" y="28" width="456" height="456" rx="102" fill="none" stroke="#bae6fd" stroke-width="1.5" opacity="0.6" />
</svg>
